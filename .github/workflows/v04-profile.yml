name: v0.4 emulator frame comparison
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/v04-profile.yml
      - tools/emulator-profile.sh
      - tools/scroll-trace.sh
      - tools/frame-report.py
      - tools/profile-summary.py
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6.4.0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.3'
      - name: Build isolated baseline and current x86 benchmark APKs
        run: |
          sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
          git worktree add ../velocity-baseline 8de8e0b
          python3 - <<'PY'
          from pathlib import Path
          for root in [Path('.'),Path('../velocity-baseline')]:
              p=root/'app/build.gradle.kts'
              s=p.read_text()
              needle='initWith(getByName("release"))'
              assert s.count(needle)==1
              s=s.replace(needle,needle+'\n            ndk { abiFilters.clear(); abiFilters += "x86_64" }')
              p.write_text(s)
              rules=root/'app/proguard-rules.pro'
              rules.write_text(rules.read_text()+'\n# Measurement only: instrumentation shares the Kotlin runtime.\n-keep,allowoptimization class kotlin.** { *; }\n-keep,allowoptimization class androidx.** { *; }\n')
          PY
          ./gradlew --max-workers=1 :app:assembleBenchmark :app:assembleDebugAndroidTest
          (cd ../velocity-baseline && ./gradlew --max-workers=1 :app:assembleBenchmark)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          arch: x86_64
          disable-animations: false
          script: bash tools/emulator-profile.sh
      - name: Upload actual traces and measurement records
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Velocity-v04-Emulator-Measurements
          path: dist/profile/
          if-no-files-found: error
          retention-days: 7
