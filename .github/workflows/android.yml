name: Android & scheduler
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - run: ./gradlew --max-workers=1 :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease :minimal-geckoview:assembleRelease :benchmark:assembleBenchmark :app:assembleBenchmark
      - name: Prepare installable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/benchmark/app-benchmark.apk dist/Velocity-Browser-arm64.apk
          test -s dist/Velocity-Browser-arm64.apk
      - name: Upload APK only
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Velocity-Browser-APK
          path: dist/Velocity-Browser-arm64.apk
          if-no-files-found: error
          compression-level: 0
  bun:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/bench-runner
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
  device-smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6.4.0
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          arch: x86_64
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notAnnotation=dev.velocity.browser.RequiresExternalFixture
      - name: Report device test outcomes
        if: always()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path('app/build/outputs/androidTest-results').rglob('TEST-*.xml'))
          if not files:
              raise SystemExit('No device test XML results; device validation is unverified')
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in files:
              suite = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
              for element in suite.iter():
                  element.tag = element.tag.rsplit('}', 1)[-1]
              for case in suite.iter('testcase'):
                  outcome = 'SKIPPED' if case.find('skipped') is not None else 'FAIL' if case.find('failure') is not None or case.find('error') is not None else 'PASS'
                  print(outcome, case.get('classname'), case.get('name'))
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      print((failure.get('message', '') + '\n' + (failure.text or ''))[:12000])
          print('DEVICE_TOTALS', totals)
          if totals['tests'] != 21:
              raise SystemExit('Expected all 21 smoke cases; partial execution is not a pass')
          if totals['failures'] or totals['errors'] or totals['skipped']:
              raise SystemExit(1)
          PYTHON
