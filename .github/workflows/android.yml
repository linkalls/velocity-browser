name: Android & scheduler
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease :minimal-geckoview:assembleRelease :benchmark:assembleBenchmark :app:assembleBenchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-and-test-reports
          path: |
            app/build/outputs/apk/
            app/build/outputs/bundle/
            benchmark/build/outputs/apk/
            minimal-geckoview/build/outputs/apk/
            core/build/reports/tests/
            app/build/reports/
  bun:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/bench-runner
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
  device-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          script: |
            ./gradlew :app:connectedDebugAndroidTest
            adb exec-out screencap -p > app/build/reports/androidTests/device-ui.png
      - name: Report device test outcomes
        if: always()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path('app/build/outputs/androidTest-results').rglob('TEST-*.xml'))
          if not files:
              raise SystemExit('No device test XML results; device validation is unverified')
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in files:
              suite = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
              for case in suite.findall('testcase'):
                  outcome = 'SKIPPED' if case.find('skipped') is not None else 'FAIL' if case.find('failure') is not None or case.find('error') is not None else 'PASS'
                  print(outcome, case.get('classname'), case.get('name'))
          print('DEVICE_TOTALS', totals)
          if totals['failures'] or totals['errors']:
              raise SystemExit(1)
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
