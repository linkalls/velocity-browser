name: Velocity · Build & Bun

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: velocity-chromium-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Test and build default Chromium app
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - name: Verify packaged Chromium renderer isolation
        run: |
          set -euo pipefail
          apk='experiments/chromium-013/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          mkdir -p dist
          apkanalyzer manifest print "$apk" > dist/chromium-manifest.xml
          python3 experiments/chromium-013/tools/audit_apk_manifest.py dist/chromium-manifest.xml > dist/chromium-manifest-audit.json
          cp "$apk" dist/Velocity-Chromium-debug-arm64.apk
          sha256sum dist/Velocity-Chromium-debug-arm64.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Velocity-Chromium-Debug-arm64-APK
          path: |
            dist/Velocity-Chromium-debug-arm64.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Velocity-Chromium-Renderer-Manifest-Audit
          path: |
            dist/chromium-manifest.xml
            dist/chromium-manifest-audit.json
          if-no-files-found: error

  bun:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/bench-runner
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
