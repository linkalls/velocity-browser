name: Chromium offline startup home regression
on:
  workflow_dispatch:
    inputs:
      fixed_run:
        description: 'Reuse unchanged fixed x86_64 APK from renderer CI; empty builds current app'
        type: string
        default: ''
        required: false
  push:
    branches: [feat/cefrium-tabs-core]
    paths:
      - '.github/workflows/chromium-startup-home.yml'
      - 'experiments/chromium-013/tools/bench/startup_home_regression.py'
      - 'experiments/chromium-013/app/src/main/java/dev/velocity/chromium/TabRegistry.java'
permissions:
  contents: read
  actions: read
jobs:
  startup-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '9.7.1'
      - name: Test and build fixed browser
        if: ${{ inputs.fixed_run == '' }}
        working-directory: experiments/chromium-013
        run: gradle --no-daemon --max-workers=2 -PchromiumAbi=x86_64 :app:testDebugUnitTest :app:assembleDebug
      - name: Stage current fixed APK
        if: ${{ inputs.fixed_run == '' }}
        run: |
          mkdir -p dist/startup-fixed
          cp experiments/chromium-013/app/build/outputs/apk/debug/app-debug.apk dist/startup-fixed/app-debug.apk
      - name: Reuse unchanged fixed APK for fixture retries
        if: ${{ inputs.fixed_run != '' }}
        uses: actions/download-artifact@v7.0.0
        with:
          name: Chromium-Cefrium-x86_64-Emulator-APK
          run-id: ${{ inputs.fixed_run }}
          github-token: ${{ github.token }}
          path: dist/startup-fixed
      - name: Download pre-fix selected-tab-restoration browser
        uses: actions/download-artifact@v7.0.0
        with:
          name: Chromium-Cefrium-x86_64-Emulator-APK
          run-id: 40686325710
          github-token: ${{ github.token }}
          path: dist/startup-baseline
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Seed saved Google tab and verify offline home plus preserved full session
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          arch: x86_64
          disk-size: 8G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -no-snapshot -memory 4096 -cores 4
          script: >-
            python3 experiments/chromium-013/tools/bench/startup_home_regression.py
            --baseline dist/startup-baseline/app-debug.apk
            --fixed dist/startup-fixed/app-debug.apk --out dist/startup-home
      - name: Record startup results
        if: always()
        run: |
          if [[ -f dist/startup-home/summary.md ]]; then
            cat dist/startup-home/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Offline-Startup-Home-Results
          path: dist/startup-home/**
          if-no-files-found: warn
