name: Chromium quiet-home audio focus regression
on:
  workflow_dispatch:
  push:
    branches: [feat/cefrium-tabs-core]
    paths:
      - '.github/workflows/chromium-audio-focus.yml'
      - 'experiments/chromium-013/audio-probe/**'
      - 'experiments/chromium-013/tools/bench/audio_focus_regression.py'
permissions:
  contents: read
  actions: read
jobs:
  audio-focus:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '9.7.1'
      - name: Test and build fixed browser plus two separate-UID audio fixtures
        working-directory: experiments/chromium-013
        run: >-
          gradle --no-daemon --max-workers=2 -PchromiumAbi=x86_64 -PaudioFocusProbe=true
          :app:testDebugUnitTest :app:assembleDebug
          :audio-probe:assemblePlayerDebug :audio-probe:assembleDuckerDebug
      - name: Download exact pre-fix x86_64 browser
        uses: actions/download-artifact@v7.0.0
        with:
          name: Chromium-Cefrium-x86_64-Emulator-APK
          run-id: 40662533601
          github-token: ${{ github.token }}
          path: dist/audio-baseline
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android music-focus retention and MAY_DUCK positive control
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          arch: x86_64
          disk-size: 8G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -no-snapshot -memory 4096 -cores 4 -no-audio
          script: >-
            python3 experiments/chromium-013/tools/bench/audio_focus_regression.py
            --baseline dist/audio-baseline/app-debug.apk
            --fixed experiments/chromium-013/app/build/outputs/apk/debug/app-debug.apk
            --player experiments/chromium-013/audio-probe/build/outputs/apk/player/debug/audio-probe-player-debug.apk
            --ducker experiments/chromium-013/audio-probe/build/outputs/apk/ducker/debug/audio-probe-ducker-debug.apk
            --out dist/audio-focus
      - name: Record focus results
        if: always()
        run: |
          if [[ -f dist/audio-focus/summary.md ]]; then
            cat dist/audio-focus/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Quiet-Home-Audio-Focus-Results
          path: dist/audio-focus/**
          if-no-files-found: warn
