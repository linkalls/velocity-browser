name: Chromium javaless feasibility audit (NO APK)
on:
  push:
    branches: [experiment/chromium-javaless-native-renderer]
    paths:
      - 'experiments/chromium/native-engine/**'
      - 'docs/chromium-javaless/**'
      - '.github/workflows/chromium-javaless-experiment.yml'
  pull_request:
    paths:
      - 'experiments/chromium/native-engine/**'
      - 'docs/chromium-javaless/**'
      - '.github/workflows/chromium-javaless-experiment.yml'
  workflow_dispatch:
    inputs:
      require_native_export:
        description: 'Hard export gate; official 0.9.4 and 0.13.0 currently FAIL. No native APK is built.'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: chromium-javaless-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-abi-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: '0.9.4'
            lock: upstream-lock.json
          - sdk: '0.13.0'
            lock: upstream-0.13.0-lock.json
    env:
      SDK_VERSION: ${{ matrix.sdk }}
      SOURCE_LOCK: experiments/chromium/native-engine/${{ matrix.lock }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Protect the working Java baseline
        run: |
          git diff --exit-code 8a223d6b57fbfa7cc978914eb3e51d170aa7bc08 -- \
            experiments/chromium ':!experiments/chromium/native-engine' \
            .github/workflows/chromium-experiment.yml
      - name: Test the export gate
        run: python3 -m unittest discover -s experiments/chromium/native-engine -p '*_test.py' -v
      - name: Verify pinned upstream source bytes and patch applicability
        run: |
          python3 experiments/chromium/native-engine/fetch_sources.py --lock "$SOURCE_LOCK" \
            --output "$RUNNER_TEMP/javaless-sources"
          if [ "$SDK_VERSION" = '0.9.4' ]; then
            git -C "$RUNNER_TEMP/javaless-sources/cefrium" apply --check \
              "$GITHUB_WORKSPACE/experiments/chromium/native-engine/patches/0001-android-native-service-export.patch"
          else
            # Confirm the upstream service-name transform against its pinned
            # Chromium source; this is not a native implementation patch.
            git -C "$RUNNER_TEMP/javaless-sources/chromium" apply -p0 --check \
              "$RUNNER_TEMP/javaless-sources/cefrium/patch/patches/android/child_service_names.patch"
          fi
          mkdir -p dist/chromium-javaless
          cp "$RUNNER_TEMP/javaless-sources/verified-sources.json" dist/chromium-javaless/
      - name: Download the official, unchanged AAR and audit both ABIs
        env:
          REQUIRE_NATIVE_EXPORT: ${{ inputs.require_native_export || false }}
        run: |
          set -euo pipefail
          AAR="$RUNNER_TEMP/cefrium-sdk-$SDK_VERSION.aar"
          AAR_URL=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["official_aar"]["url"])' "$SOURCE_LOCK")
          AAR_SHA256=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["official_aar"]["sha256"])' "$SOURCE_LOCK")
          curl --fail --location --retry 3 --max-time 300 \
            "$AAR_URL" -o "$AAR"
          EXTRA=()
          if [ "$REQUIRE_NATIVE_EXPORT" = true ]; then EXTRA+=(--require-native-export); fi
          python3 experiments/chromium/native-engine/audit.py "$AAR" \
            --sha256 "$AAR_SHA256" --require-java-pool \
            --abi arm64-v8a --abi x86_64 --output dist/chromium-javaless "${EXTRA[@]}"
      - name: Report native eligibility separately from audit execution
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = Path('dist/chromium-javaless/audit.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Phase A only — native APK NOT BUILT; runtime NOT TESTED\n\n')
              if report.exists():
                  data = json.loads(report.read_text())
                  pool = data['aar_manifest']
                  summary.write('Cefrium ' + os.environ['SDK_VERSION'] + '\n\n')
                  summary.write('Declared Java pool: **' + pool['java_service_pool_gate']
                                + '** (' + str(pool['java_sandboxed_services']) + ' services).\n\n')
                  summary.write('Native export gate: **' + data['export_gate'] + '**.\n\n')
                  summary.write('Audit success means evidence was collected, not that a native renderer works.\n')
              else:
                  summary.write('Audit did not complete; inspect the failed step.\n')
          PY
      - name: Upload feasibility evidence (no APK or engine binary)
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Chromium-Javaless-Feasibility-${{ matrix.sdk }}-NO-APK
          path: |
            dist/chromium-javaless/
            docs/chromium-javaless/
            experiments/chromium/native-engine/upstream-lock.json
            experiments/chromium/native-engine/upstream-0.13.0-lock.json
            experiments/chromium/native-engine/patches/
          if-no-files-found: error
