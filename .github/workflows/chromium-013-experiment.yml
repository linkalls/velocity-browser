name: Chromium Cefrium 0.13 Java experiment APK
on:
  push:
    branches: [feat/chromium-cefrium-0.13]
    paths:
      - 'experiments/chromium-013/**'
      - 'experiments/chromium/native-engine/audit.py'
      - '.github/workflows/chromium-013-experiment.yml'
  pull_request:
    paths:
      - 'experiments/chromium-013/**'
      - 'experiments/chromium/native-engine/audit.py'
      - '.github/workflows/chromium-013-experiment.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chromium-013-experiment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '9.7.1'
      - name: Build independent Chromium engine APK
        working-directory: experiments/chromium-013
        run: gradle --no-daemon --max-workers=2 :app:testDebugUnitTest :app:assembleDebug
      - name: Test and audit the packaged Java renderer pool
        run: |
          set -euo pipefail
          python3 -m unittest discover -s experiments/chromium-013/tools -p '*_test.py' -v
          mkdir -p dist
          apkanalyzer manifest print experiments/chromium-013/app/build/outputs/apk/debug/app-debug.apk > dist/chromium-013-manifest.xml
          python3 experiments/chromium-013/tools/audit_apk_manifest.py dist/chromium-013-manifest.xml > dist/chromium-013-manifest-audit.json
      - name: Upload packaged Manifest evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Chromium-CEF-013-Packaged-Manifest-Audit
          path: |
            dist/chromium-013-manifest.xml
            dist/chromium-013-manifest-audit.json
          if-no-files-found: warn
      - name: Validate APK and package
        run: |
          set -euo pipefail
          mkdir -p dist
          test -s experiments/chromium-013/app/build/outputs/apk/debug/app-debug.apk
          cp experiments/chromium-013/app/build/outputs/apk/debug/app-debug.apk dist/Velocity-Chromium-CEF-013-arm64-EXPERIMENT.apk
          du -h dist/Velocity-Chromium-CEF-013-arm64-EXPERIMENT.apk
          sha256sum dist/Velocity-Chromium-CEF-013-arm64-EXPERIMENT.apk > dist/SHA256SUMS.txt
      - name: Publish experimental APK only
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Velocity-Chromium-CEF-013-arm64-EXPERIMENT
          path: |
            dist/Velocity-Chromium-CEF-013-arm64-EXPERIMENT.apk
            dist/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error

  chromium-emulator-smoke:
    strategy:
      fail-fast: false
      matrix:
        # API 37 packages use the explicit minor-version name.
        api: ['36', '37.0']
    needs: chromium-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '9.7.1'
      - name: Build x86_64 Chromium diagnostic APK
        working-directory: experiments/chromium-013
        run: gradle --no-daemon --max-workers=2 -PchromiumAbi=x86_64 :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          # Chromium APK + extracted libraries + dex need room beyond the image defaults.
          disk-size: 6G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -memory 4096 -cores 4
          script: bash experiments/chromium-013/tools/boot-smoke.sh
      - name: Upload logcat and Activity results even when failed
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Chromium-CEF-013-Emulator-Crash-Logs-API${{ matrix.api }}
          path: |
            dist/cefrium-storage-before-install.txt
            dist/cefrium-install.txt
            dist/cefrium-install-logcat.txt
            dist/cefrium-activity-start.txt
            dist/cefrium-pid.txt
            dist/cefrium-activities.txt
            dist/cefrium-logcat-filtered.txt
            dist/cefrium-screen.png
            dist/cefrium-window.txt
          if-no-files-found: warn
