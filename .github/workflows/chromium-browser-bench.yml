name: Chromium Android browser comparison

on:
  push:
    branches: [feat/cefrium-tabs-core]
    paths:
      - 'experiments/chromium-013/**'
      - '.github/workflows/chromium-browser-bench.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromium-browser-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '9.7.1'
      - name: Run parser tests
        run: python3 -m unittest discover -s experiments/chromium-013/tools/bench -p 'test_*.py' -v
      - name: Build matching x86_64 Velocity debug APK
        working-directory: experiments/chromium-013
        run: gradle --no-daemon --max-workers=2 -PchromiumAbi=x86_64 :app:assembleDebug
      - name: Download competitor APKs from official sources
        run: python3 experiments/chromium-013/tools/bench/fetch_competitors.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Measure browsers on one identical emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis_playstore
          arch: x86_64
          disk-size: 8G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -memory 4096 -cores 4
          script: bash experiments/chromium-013/tools/bench/run_on_emulator.sh
      - name: Show results in GitHub Actions summary
        if: always()
        shell: bash
        run: |
          if [[ -f dist/browser-bench/summary.md ]]; then
            cat dist/browser-bench/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No measurements: emulator or setup did not complete.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save evidence and machine-readable results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Velocity-Chrome-Brave-Vivaldi-Android-Benchmark
          path: |
            dist/browser-bench/results.json
            dist/browser-bench/summary.md
            dist/browser-bench/downloads.json
            dist/browser-bench/*-install.txt
            dist/browser-bench/last-screen.png
          if-no-files-found: warn
