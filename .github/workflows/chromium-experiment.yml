name: Chromium CEF experiment APK
on:
  push:
    branches: [experiment/chromium-cefrium-engine]
    paths:
      - 'experiments/chromium/**'
      - '.github/workflows/chromium-experiment.yml'
  pull_request:
    paths:
      - 'experiments/chromium/**'
      - '.github/workflows/chromium-experiment.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chromium-experiment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '9.7.1'
      - name: Build independent Chromium engine APK
        working-directory: experiments/chromium
        run: gradle --no-daemon --max-workers=2 :app:testDebugUnitTest :app:assembleDebug
      - name: Audit Chromium renderer services and native entry point
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=experiments/chromium/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT" dump xmltree --file AndroidManifest.xml "$APK" > dist/chromium-manifest-tree.txt
          echo "### Chromium child services in packaged APK" | tee dist/chromium-service-audit.txt
          grep -E 'NativeOnlySandboxedProcessService0|SandboxedProcessService0|NUM_SANDBOXED_SERVICES|nativeService|externalService|NativeChildProcessService_onCreate|libcef.so' dist/chromium-manifest-tree.txt | head -n 65 | tee -a dist/chromium-service-audit.txt || true
          if ! grep -q 'org.chromium.content.app.SandboxedProcessService0' dist/chromium-manifest-tree.txt; then
            echo "ERROR: Java isolated renderer service is missing!" | tee -a dist/chromium-service-audit.txt
            exit 1
          fi
          echo "Java sandboxed renderer service 0 present in packaged APK" | tee -a dist/chromium-service-audit.txt
          if grep -q 'org.chromium.content.app.NativeOnlySandboxedProcessService0' dist/chromium-manifest-tree.txt; then
            echo "NOTE: a native-only service is also declared; confirm libcef exports its required entry point." | tee -a dist/chromium-service-audit.txt
          else
            echo "Native-only service omitted because Cefrium 0.9.4 does not export its implementation; Android 17 uses --javaless-renderers=disabled" | tee -a dist/chromium-service-audit.txt
          fi
          unzip -p "$APK" lib/arm64-v8a/libcef.so > /tmp/velocity-libcef.so
          if readelf --dyn-syms -W /tmp/velocity-libcef.so | grep -F 'NativeChildProcessService_onCreate' | tee -a dist/chromium-service-audit.txt; then
            echo "Native-only export detected (not selected by Velocity Java compatibility mode)" | tee -a dist/chromium-service-audit.txt
          else
            echo "Native-only entry point is not exported; Java isolated renderer mode required" | tee -a dist/chromium-service-audit.txt
          fi
      - name: Upload Chromium service and symbol audit
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Chromium-CEF-Native-Service-Audit
          path: |
            dist/chromium-service-audit.txt
            dist/chromium-manifest-tree.txt
          if-no-files-found: warn
      - name: Validate APK and package
        run: |
          set -euo pipefail
          mkdir -p dist
          test -s experiments/chromium/app/build/outputs/apk/debug/app-debug.apk
          cp experiments/chromium/app/build/outputs/apk/debug/app-debug.apk dist/Velocity-Chromium-CEF-arm64-EXPERIMENT.apk
          du -h dist/Velocity-Chromium-CEF-arm64-EXPERIMENT.apk
          sha256sum dist/Velocity-Chromium-CEF-arm64-EXPERIMENT.apk > dist/SHA256SUMS.txt
      - name: Publish experimental APK only
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Velocity-Chromium-CEF-arm64-EXPERIMENT
          path: |
            dist/Velocity-Chromium-CEF-arm64-EXPERIMENT.apk
            dist/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error

  chromium-emulator-smoke:
    needs: chromium-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '9.7.1'
      - name: Build x86_64 Chromium diagnostic APK
        working-directory: experiments/chromium
        run: gradle --no-daemon --max-workers=2 -PchromiumAbi=x86_64 :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -memory 4096 -cores 4
          script: bash experiments/chromium/tools/boot-smoke.sh
      - name: Upload logcat and Activity results even when failed
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Chromium-CEF-Emulator-Crash-Logs
          path: |
            dist/cefrium-activity-start.txt
            dist/cefrium-pid.txt
            dist/cefrium-activities.txt
            dist/cefrium-logcat-filtered.txt
          if-no-files-found: warn
