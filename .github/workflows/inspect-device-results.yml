name: Inspect device test results
on:
  push:
    paths:
      - .github/workflows/inspect-device-results.yml
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed Android workflow run ID in this repository
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download device reports
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow android.yml --status failure --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          test -n "$RUN_ID" && test "$RUN_ID" != null
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name instrumentation-reports --dir reports
      - name: Print test cases and failures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path('reports').rglob('TEST-*.xml'))
          if not files:
              raise SystemExit('No XML results: unverified')
          for path in files:
              root = ET.parse(path).getroot()
              for element in root.iter():
                  element.tag = element.tag.rsplit('}', 1)[-1]
              print('SUITE', path, root.attrib)
              for case in root.iter('testcase'):
                  print('CASE', case.attrib)
                  for outcome in case:
                      if outcome.tag in ('failure', 'error', 'skipped'):
                          print(outcome.tag, outcome.attrib, (outcome.text or '')[:12000])
          PY
